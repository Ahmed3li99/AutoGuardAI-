<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="256" height="256">
  <!-- AutoGuard AI "Black Box" mark. Recorder-orange casing with the two reflective bands of a
       flight recorder; inside, a screen with a live trace ending in the REC point: the car's own
       black box, which records the trip and understands it. Small sizes use logo_small.svg. -->
  <defs>
    <linearGradient id="casing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A2B"/>
      <stop offset="1" stop-color="#F25A06"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F24"/>
      <stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
    <clipPath id="body"><rect x="6" y="10" width="108" height="100" rx="22"/></clipPath>
  </defs>
  <rect x="6" y="10" width="108" height="100" rx="22" fill="url(#casing)"/>
  <g clip-path="url(#body)">
    <rect x="0" y="24" width="120" height="7" fill="#FFFFFF" fill-opacity="0.88"/>
    <rect x="0" y="89" width="120" height="7" fill="#FFFFFF" fill-opacity="0.88"/>
  </g>
  <rect x="20" y="38" width="80" height="44" rx="9" fill="url(#screen)"/>
  <polyline points="27,62 40,62 46,50 54,74 62,46 68,62 78,62" fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="62" r="5" fill="#FF6A13"/>
</svg>
