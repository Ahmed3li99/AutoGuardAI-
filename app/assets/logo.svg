<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AutoGuard AI mark. A guard shield (protection) around an instrument gauge (the car), crossed by a
       live signal trace (its telemetry) that ends in a cyan reading point (the AI reading it). -->
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1B3A72"/>
      <stop offset="0.5" stop-color="#0F2350"/>
      <stop offset="1" stop-color="#060E24"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF3FF"/>
      <stop offset="0.45" stop-color="#2F8BFF"/>
      <stop offset="1" stop-color="#1C4FD8"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9AF6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2F8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2F8BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- shield with a gradient edge -->
  <path d="M128 10 C152 26 188 36 222 38 C227 42 229 47 229 53 L229 116 C229 179 189 222 128 248 C67 222 27 179 27 116 L27 53 C27 47 29 42 34 38 C68 36 104 26 128 10 Z"
        fill="url(#edge)"/>
  <path d="M128 24 C150 38 182 47 214 50 L214 116 C214 170 180 207 128 232 C76 207 42 170 42 116 L42 50 C74 47 106 38 128 24 Z"
        fill="url(#body)"/>
  <path d="M128 24 C150 38 182 47 214 50 L214 116 C214 170 180 207 128 232 C76 207 42 170 42 116 L42 50 C74 47 106 38 128 24 Z"
        fill="url(#glow)"/>
  <!-- gauge arc with ticks -->
  <path d="M76 160 A60 60 0 1 1 180 160" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>
  <path d="M76 160 A60 60 0 0 1 103 81" fill="none" stroke="#22D3EE" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <line x1="128" y1="62" x2="128" y2="72"/>
    <line x1="171" y1="80" x2="164" y2="87"/>
    <line x1="85" y1="80" x2="92" y2="87"/>
  </g>
  <!-- signal trace and reading point -->
  <polyline points="60,134 94,134 108,106 128,166 147,116 159,134 180,134"
            fill="none" stroke="url(#trace)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="194" cy="134" r="13" fill="#22D3EE"/>
  <circle cx="194" cy="134" r="5.5" fill="#FFFFFF"/>
</svg>
